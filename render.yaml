# Render Blueprint for the IA Planning backend (FastAPI + Postgres).
# Frontend is deployed separately on Vercel (root dir: frontend/).
# One-click: New → Blueprint → pick this repo. Then set the two `sync: false`
# vars in the dashboard (they're secrets / per-deploy URLs, not committed).
services:
  - type: web
    name: ia-planning-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Neon Postgres connection string (postgresql://user:pass@host/db?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Comma-separated deployed frontend origins, e.g. https://ia-planning.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
